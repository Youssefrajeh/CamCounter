services:
  - type: web
    name: camcounter
    runtime: python
    plan: starter  # 512MB RAM — tuned for low-memory container
    buildCommand: "chmod +x render-build.sh && ./render-build.sh"
    startCommand: "uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 50"
    envVars:
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "65536"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/cameras
    disk:
      name: camcounter-data
      # Matches DATA_DIR in backend/config.py (BASE_DIR/data) -- without this,
      # data/camcounter.db (cameras, counts, alerts) is wiped on every deploy.
      mountPath: /opt/render/project/src/data
      sizeGB: 1

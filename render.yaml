services:
  - type: web
    name: camcounter
    runtime: python
    plan: starter  # 512MB RAM — CPU-only PyTorch fits
    buildCommand: "chmod +x render-build.sh && ./render-build.sh"
    startCommand: "uvicorn backend.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
    healthCheckPath: /api/cameras
